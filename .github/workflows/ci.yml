name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pulse
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app -d pulse"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: pulse
      DB_USERNAME: app
      DB_PASSWORD: app
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Laravel writable directories
        run: mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: 'pdo_pgsql, redis, pcntl, mbstring'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - name: PHP syntax check
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit incident-domain contracts
        run: php artisan test tests/Unit
      - name: Stale expected-version contract
        run: php artisan test --filter=test_stale_expected_version_returns_latest_snapshot_without_lost_update
      - name: Client command replay contract
        run: php artisan test --filter=test_client_command_replay_is_idempotent
      - name: Event replay cursor contract
        run: php artisan test --filter=test_event_replay_returns_only_sequences_after_cursor
      - name: Tenant isolation contract
        run: php artisan test --filter=test_cross_tenant_incident_access_is_forbidden
      - run: npm install --no-audit --no-fund && npm run build
