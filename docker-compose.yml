services:
  app:
    build:
      context: .
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-pulse-local-key}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    env_file: .env
    ports: ["8000:8000"]
    environment:
      REVERB_HOST: reverb
      REVERB_PORT: 8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: .
    env_file: .env
    command: php artisan queue:work --queue=broadcasts,notifications,default --tries=5
    environment:
      REVERB_HOST: reverb
      REVERB_PORT: 8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      reverb: { condition: service_started }
  scheduler:
    build: .
    env_file: .env
    command: php artisan schedule:work
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  reverb:
    build: .
    env_file: .env
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports: ["8080:8080"]
    depends_on: [redis]
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: pulse, POSTGRES_USER: app, POSTGRES_PASSWORD: app }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U app"], interval: 5s, timeout: 3s, retries: 10 }
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    volumes: ["redis-data:/data"]
volumes: { postgres-data: {}, redis-data: {} }
